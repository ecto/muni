[package]
name = "depot-types"
version = "0.1.0"
edition = "2021"
description = "Shared types for Depot services"
license = "Proprietary"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
serde_json = "1"
