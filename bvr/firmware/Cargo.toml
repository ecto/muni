[workspace]
resolver = "2"
members = ["crates/*", "bins/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Proprietary"
repository = "https://github.com/muni-robotics/muni"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "tracing"] }

# Tokio console (runtime introspection)
console-subscriber = "0.4"

# Serialization
serde = { version = "1", features = ["derive"] }
toml = "0.8"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Recording
rerun = "0.22"

# Error handling
thiserror = "2"
anyhow = "1"

# Utilities
bitflags = "2"
nalgebra = { version = "0.33", features = ["serde-serialize"] }

# CLI
clap = { version = "4", features = ["derive"] }

# JSON
serde_json = "1"

# Binary serialization
bincode = "1"

# TypeScript type generation
ts-rs = "10"

# Time and IDs
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

# WebSocket
tokio-tungstenite = "0.26"
futures-util = "0.3"

# WebRTC (for unreliable DataChannel - UDP-like teleop)
webrtc = "0.12"

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Internal crates
types = { path = "crates/types" }
can = { path = "crates/can" }
control = { path = "crates/control" }
state = { path = "crates/state" }
hal = { path = "crates/hal" }
teleop = { path = "crates/teleop" }
tools = { path = "crates/tools" }
sim = { path = "crates/sim" }
ui = { path = "crates/ui" }
camera = { path = "crates/camera" }
gps = { path = "crates/gps" }
lidar = { path = "crates/lidar" }
localization = { path = "crates/localization" }
recording = { path = "crates/recording" }
metrics = { path = "crates/metrics" }
rl = { path = "crates/rl" }
policy = { path = "crates/policy" }
depth = { path = "crates/depth" }
dispatch = { path = "crates/dispatch" }
transforms = { path = "crates/transforms" }
slamwich = { git = "https://github.com/ecto/slamwich", branch = "main" }
slam = { path = "crates/slam" }
costmap = { path = "crates/costmap" }
planner = { path = "crates/planner" }
pursuit = { path = "crates/pursuit" }
control-loop = { path = "crates/control-loop" }
collision-monitor = { path = "crates/collision-monitor" }
mppi = { path = "crates/mppi" }

# KD-tree for nearest-neighbor queries
kiddo = "5"

# RL training dependencies
rand = { version = "0.8", features = ["small_rng"] }

# System metrics
sysinfo = "0.32"
