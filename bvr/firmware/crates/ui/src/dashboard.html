<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BVR Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: "SF Mono", "Cascadia Mono", "Courier New", monospace;
            background: #1c1917;
            color: #fafaf9;
            padding: 16px;
            min-height: 100vh;
            font-size: 13px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding: 8px 12px;
            background: #44403c;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .header h1 {
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #a8a29e;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
        }
        .status-dot.connected { background: #22c55e; }
        .status-dot.disconnected { background: #dc2626; animation: pulse 1s infinite; }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 12px;
        }
        .card {
            background: rgba(41,37,36,0.9);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 12px;
        }
        .card h2 {
            font-size: 10px;
            color: #a8a29e;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 10px;
        }
        .mode {
            display: inline-block;
            padding: 2px 8px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border: 1px solid rgba(255,255,255,0.1);
            color: #a8a29e;
        }
        .mode.disabled { color: #a8a29e; background: transparent; }
        .mode.idle { color: #a8a29e; background: transparent; }
        .mode.teleop { color: #fff; background: #e77c40; border-color: #e77c40; }
        .mode.autonomous { color: #fff; background: #e77c40; border-color: #e77c40; }
        .mode.estop { color: #fff; background: #dc2626; border-color: #dc2626; }
        .mode.fault { color: #fff; background: #dc2626; border-color: #dc2626; }
        .battery-bar {
            height: 6px;
            background: rgba(255,255,255,0.1);
            overflow: hidden;
            margin: 8px 0;
        }
        .battery-fill {
            height: 100%;
            background: #22c55e;
            transition: width 0.3s;
        }
        .battery-fill.low { background: #f97316; }
        .battery-fill.critical { background: #dc2626; }
        .stat {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            font-size: 12px;
        }
        .stat:last-child { border-bottom: none; }
        .stat-label { color: #a8a29e; }
        .stat-value { font-weight: 600; }
        .motor-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }
        .motor {
            background: #1c1917;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 8px;
            text-align: center;
        }
        .motor-label {
            font-size: 10px;
            color: #a8a29e;
            text-transform: uppercase;
            margin-bottom: 4px;
        }
        .motor-temp {
            font-size: 16px;
            font-weight: 600;
        }
        .motor-temp.hot { color: #f97316; }
        .motor-temp.critical { color: #dc2626; }
        .tool-status {
            padding: 10px;
            background: #1c1917;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .tool-name {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .tool-active {
            display: inline-block;
            padding: 2px 8px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }
        .tool-active.on { background: #22c55e; color: #fff; }
        .tool-active.off { background: transparent; color: #a8a29e; border: 1px solid rgba(255,255,255,0.1); }
        .position-bar {
            height: 4px;
            background: rgba(255,255,255,0.1);
            margin-top: 8px;
        }
        .position-fill {
            height: 100%;
            background: #e77c40;
            transition: width 0.3s;
        }
        .error-banner {
            background: #7f1d1d;
            color: #fecaca;
            padding: 10px 12px;
            margin-bottom: 12px;
            display: none;
            font-size: 12px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .error-banner.visible { display: block; }

        /* Blocking overlay for error states */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(28,25,23,0.92);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .overlay.visible {
            opacity: 1;
            pointer-events: auto;
        }
        .overlay.estop-overlay {
            background: rgba(69,10,10,0.92);
        }
        .overlay.fault-overlay {
            background: rgba(69,26,3,0.92);
        }
        .overlay-icon {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            opacity: 0.6;
        }
        .overlay-title {
            font-size: 18px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
            color: #fafaf9;
        }
        .overlay-subtitle {
            font-size: 12px;
            color: #a8a29e;
            text-align: center;
            max-width: 400px;
        }
        .overlay-status {
            margin-top: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .overlay-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #a8a29e;
        }
        .overlay-dot.pulse {
            background: #e77c40;
            animation: pulse 1.5s infinite;
        }
        .overlay-dot.error {
            background: #dc2626;
            animation: pulse 1s infinite;
        }
        .overlay-label {
            font-size: 12px;
            color: #a8a29e;
        }
    </style>
</head>
<body>
    <!-- Blocking overlay for error states -->
    <div class="overlay visible" id="overlay">
        <svg class="overlay-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M8.288 15.038a5.25 5.25 0 017.424 0M5.106 11.856c3.807-3.808 9.98-3.808 13.788 0M1.924 8.674c5.565-5.565 14.587-5.565 20.152 0M12.53 18.22l-.53.53-.53-.53a.75.75 0 011.06 0z"/>
        </svg>
        <div class="overlay-title" id="overlay-title">Connecting</div>
        <div class="overlay-subtitle" id="overlay-subtitle">Waiting for rover daemon</div>
        <div class="overlay-status">
            <div class="overlay-dot pulse" id="overlay-dot"></div>
            <span class="overlay-label" id="overlay-label">Connecting...</span>
        </div>
    </div>

    <div class="header">
        <h1>BVR Dashboard</h1>
        <div id="connection">
            <span class="status-dot disconnected" id="status-dot"></span>
            <span id="connection-text">Connecting...</span>
        </div>
    </div>

    <div class="error-banner" id="error-banner"></div>

    <div class="grid">
        <div class="card">
            <h2>Mode</h2>
            <div class="mode" id="mode">---</div>
        </div>

        <div class="card">
            <h2>Battery</h2>
            <div class="battery-bar">
                <div class="battery-fill" id="battery-fill" style="width: 0%"></div>
            </div>
            <div class="stat">
                <span class="stat-label">Voltage</span>
                <span class="stat-value" id="voltage">--.- V</span>
            </div>
            <div class="stat">
                <span class="stat-label">Current</span>
                <span class="stat-value" id="current">--.- A</span>
            </div>
        </div>

        <div class="card">
            <h2>Velocity</h2>
            <div class="stat">
                <span class="stat-label">Linear</span>
                <span class="stat-value" id="linear">--.- m/s</span>
            </div>
            <div class="stat">
                <span class="stat-label">Angular</span>
                <span class="stat-value" id="angular">--.- rad/s</span>
            </div>
        </div>

        <div class="card">
            <h2>Motor Temps</h2>
            <div class="motor-grid">
                <div class="motor">
                    <div class="motor-label">FL</div>
                    <div class="motor-temp" id="temp-fl">--°C</div>
                </div>
                <div class="motor">
                    <div class="motor-label">FR</div>
                    <div class="motor-temp" id="temp-fr">--°C</div>
                </div>
                <div class="motor">
                    <div class="motor-label">RL</div>
                    <div class="motor-temp" id="temp-rl">--°C</div>
                </div>
                <div class="motor">
                    <div class="motor-label">RR</div>
                    <div class="motor-temp" id="temp-rr">--°C</div>
                </div>
            </div>
        </div>

        <div class="card">
            <h2>Tool</h2>
            <div class="tool-status" id="tool-status">
                <div class="tool-name" id="tool-name">No tool attached</div>
            </div>
        </div>
    </div>

    <script>
        const modeNames = ['Disabled', 'Idle', 'Teleop', 'Autonomous', 'EStop', 'Fault'];
        const modeClasses = ['disabled', 'idle', 'teleop', 'autonomous', 'estop', 'fault'];

        let connected = false;
        let lastUpdate = 0;
        let currentMode = 'Idle';

        async function fetchTelemetry() {
            try {
                const response = await fetch('/api/telemetry');
                if (!response.ok) throw new Error('Network error');

                const data = await response.json();
                updateDashboard(data);
                setConnected(true);
                lastUpdate = Date.now();
            } catch (e) {
                if (Date.now() - lastUpdate > 3000) {
                    setConnected(false);
                }
            }
        }

        function setConnected(isConnected) {
            connected = isConnected;
            const dot = document.getElementById('status-dot');
            const text = document.getElementById('connection-text');

            if (isConnected) {
                dot.className = 'status-dot connected';
                text.textContent = 'Connected';
            } else {
                dot.className = 'status-dot disconnected';
                text.textContent = 'Disconnected';
            }

            updateOverlay();
        }

        function updateOverlay() {
            const overlay = document.getElementById('overlay');
            const title = document.getElementById('overlay-title');
            const subtitle = document.getElementById('overlay-subtitle');
            const dot = document.getElementById('overlay-dot');
            const label = document.getElementById('overlay-label');

            // Reset variant classes
            overlay.classList.remove('estop-overlay', 'fault-overlay');

            // Only show blocking overlay for error states - telemetry is always useful
            if (!connected) {
                overlay.classList.add('visible');
                title.textContent = 'Disconnected';
                subtitle.textContent = 'Unable to reach rover daemon';
                dot.className = 'overlay-dot error';
                label.textContent = 'Connection lost';
            } else if (currentMode === 'EStop') {
                overlay.classList.add('visible', 'estop-overlay');
                title.textContent = 'Emergency Stop';
                subtitle.textContent = 'E-Stop is active. Clear before resuming operation.';
                dot.className = 'overlay-dot error';
                label.textContent = 'E-Stop active';
            } else if (currentMode === 'Fault') {
                overlay.classList.add('visible', 'fault-overlay');
                title.textContent = 'Fault Detected';
                subtitle.textContent = 'System fault. Check logs for details.';
                dot.className = 'overlay-dot error';
                label.textContent = 'Fault';
            } else {
                overlay.classList.remove('visible');
            }
        }

        function updateDashboard(data) {
            // Mode
            const modeEl = document.getElementById('mode');
            const modeIdx = typeof data.mode === 'string' ? modeNames.indexOf(data.mode) : data.mode;
            currentMode = modeNames[modeIdx] || 'Unknown';
            modeEl.textContent = currentMode;
            modeEl.className = 'mode ' + (modeClasses[modeIdx] || '');

            // Update overlay based on new mode
            updateOverlay();

            // Battery
            const voltage = data.power?.battery_voltage || 0;
            const percent = Math.max(0, Math.min(100, ((voltage - 39) / (54.6 - 39)) * 100));
            const fill = document.getElementById('battery-fill');
            fill.style.width = percent + '%';
            fill.className = 'battery-fill' + (percent < 20 ? ' critical' : percent < 40 ? ' low' : '');

            document.getElementById('voltage').textContent = voltage.toFixed(1) + ' V';
            document.getElementById('current').textContent = (data.power?.system_current || 0).toFixed(1) + ' A';

            // Velocity
            document.getElementById('linear').textContent = (data.velocity?.linear || 0).toFixed(2) + ' m/s';
            document.getElementById('angular').textContent = (data.velocity?.angular || 0).toFixed(2) + ' rad/s';

            // Motor temps
            const temps = data.motor_temps || [0, 0, 0, 0];
            ['fl', 'fr', 'rl', 'rr'].forEach((pos, i) => {
                const el = document.getElementById('temp-' + pos);
                const temp = temps[i] || 0;
                el.textContent = temp.toFixed(0) + '°C';
                el.className = 'motor-temp' + (temp > 80 ? ' critical' : temp > 60 ? ' hot' : '');
            });

            // Tool
            const toolEl = document.getElementById('tool-status');
            if (data.tool_status) {
                const ts = data.tool_status;
                toolEl.innerHTML = `
                    <div class="tool-name">${ts.name}</div>
                    <span class="tool-active ${ts.active ? 'on' : 'off'}">${ts.active ? 'Active' : 'Standby'}</span>
                    ${ts.position !== null ? `
                        <div class="position-bar">
                            <div class="position-fill" style="width: ${(ts.position * 100).toFixed(0)}%"></div>
                        </div>
                    ` : ''}
                    ${ts.current !== null ? `<div class="stat"><span class="stat-label">Current</span><span class="stat-value">${ts.current.toFixed(1)} A</span></div>` : ''}
                `;
            } else if (data.active_tool) {
                toolEl.innerHTML = `<div class="tool-name">${data.active_tool}</div>`;
            } else {
                toolEl.innerHTML = `<div class="tool-name">No tool attached</div>`;
            }
        }

        // Poll every 200ms
        setInterval(fetchTelemetry, 200);
        fetchTelemetry();
    </script>
</body>
</html>
