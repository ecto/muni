[package]
name = "hal"
description = "Hardware abstraction layer for bvr (GPIO, ADC, power monitoring)"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# Enable GPIO support via libgpiod (requires Linux with gpiod)
gpio = ["tokio-gpiod", "tokio"]

[dependencies]
types = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

# Optional GPIO support for hardware e-stop
tokio-gpiod = { version = "0.3", optional = true }
tokio = { workspace = true, optional = true }



