[package]
name = "bvrd"
description = "Main daemon for bvr"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# Enable hardware GPIO support (Jetson Orin NX) for hardware e-stop
gpio = ["hal/gpio"]
# Enable ONNX depth model inference (requires ort + model file on disk)
depth-onnx = ["depth/onnx"]
# Enable tokio-console for runtime introspection
console = ["dep:console-subscriber"]

[dependencies]
types = { workspace = true }
can = { workspace = true }
control = { workspace = true }
hal = { workspace = true }
state = { workspace = true }
teleop = { workspace = true }
tools = { workspace = true }
sim = { workspace = true }
ui = { workspace = true }
camera = { workspace = true }
gps = { workspace = true }
lidar = { workspace = true }
localization = { workspace = true }
recording = { workspace = true }
metrics = { workspace = true }
policy = { workspace = true }
dispatch = { workspace = true }
transforms = { workspace = true }
slam = { workspace = true }
costmap = { workspace = true }
planner = { workspace = true }
pursuit = { workspace = true }
control-loop = { workspace = true }
collision-monitor = { workspace = true }
mppi = { workspace = true }
depth = { workspace = true }
nalgebra = { workspace = true }

tokio = { workspace = true }
serde = { workspace = true }
uuid = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }

tokio-serial = "5.4"

# Optional: tokio-console for runtime introspection
console-subscriber = { workspace = true, optional = true }



