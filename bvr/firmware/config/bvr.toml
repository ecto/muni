# bvr runtime configuration

[chassis]
# Wheel diameter in meters
wheel_diameter_m = 0.165
# Distance between left and right wheels (track width)
track_width_m = 0.55
# Distance between front and rear axles
wheelbase_m = 0.55
# Maximum linear speed (m/s)
max_speed_mps = 3.0
# Maximum linear acceleration (m/s²) — high for responsive teleop
max_accel_mps2 = 50.0
# Maximum angular velocity (rad/s)
max_angular_vel_rps = 2.0

[can]
# SocketCAN interface name
interface = "can0"
# CAN bus bitrate
bitrate = 500_000
# ESC node IDs: [front-left, front-right, rear-left, rear-right]
esc_ids = [0, 1, 2, 3]
# Timeout for ESC heartbeats (ms)
heartbeat_timeout_ms = 100

[control]
# Control loop frequency (Hz)
loop_rate_hz = 100
# Command timeout — if no command received, safe stop (ms)
command_timeout_ms = 250
# Seconds of inactivity in Idle/Disabled before auto-transitioning to Sleep (0 = disabled)
sleep_timeout_secs = 300
# Velocity PID gains (per-wheel)
[control.pid]
kp = 1.0
ki = 0.1
kd = 0.01

[teleop]
# UDP port for command/telemetry
port = 4840
# Heartbeat interval to operator station (ms)
heartbeat_interval_ms = 100
# Connection timeout (ms)
connection_timeout_ms = 1000

[power]
# Voltage thresholds (48V nominal)
battery_full_v = 54.0
battery_nominal_v = 48.0
battery_low_v = 42.0
battery_critical_v = 39.0

[gps]
# Enable GPS receiver
enabled = true
# Serial port for ZED-F9P (USB-C appears as ACM device on Jetson)
port = "/dev/ttyACM0"
# Baud rate (38400 default, 115200 for high-rate output)
baud_rate = 38400
# Update rate in Hz (ZED-F9P supports up to 25Hz, 10Hz recommended)
update_rate_hz = 10

[ntrip]
# Enable NTRIP client for RTK corrections
enabled = true
# Base station NTRIP caster (depot server on mesh network)
server = "192.168.1.129"
port = 2101
# Mountpoint name on the caster
mountpoint = "ROVER"
# Optional: username/password if caster requires auth
# username = ""
# password = ""
# Reconnect delay on connection loss (seconds)
reconnect_delay_secs = 5

[logging]
# Log level: trace, debug, info, warn, error
level = "info"
# Log directory for rolling file logs
dir = "/var/log/bvr"
# Rotation: "daily", "hourly", or "never"
rotation = "daily"
# Number of days to retain logs
retain_days = 7

[recording]
# Enable telemetry recording to Rerun .rrd files
enabled = true
# Directory for session recordings
session_dir = "/var/log/bvr/sessions"
# Maximum storage before rotating old sessions (bytes)
max_storage_bytes = 10_737_418_240  # 10 GB
# Include camera frames in recording (increases storage)
include_camera = false

[identity]
# Unique rover identifier (used in logs, recordings, sync)
rover_id = "frog-0"

[sync]
# Enable automatic sync to base station
enabled = true
# Base station destination (rclone remote:path format)
# Examples:
#   - "base:bvr-sessions"     (configured rclone remote)
#   - "sftp:user@host:/data"  (SFTP)
#   - "s3:bucket/sessions"    (S3-compatible)
destination = "base:bvr-sessions"
# Sync interval in seconds (0 = sync only on session end)
interval_secs = 900  # 15 minutes
# Minimum file age before syncing (avoids syncing active files)
min_age_secs = 60

[metrics]
# Enable real-time metrics push to Depot
enabled = true
# Depot endpoint (IP:port or hostname:port)
# InfluxDB listens on UDP port 8089 for line protocol
endpoint = "192.168.1.129:8089"
# Push rate in Hz (1 = once per second, recommended)
interval_hz = 1

[discovery]
# Enable rover discovery registration
enabled = true
# Discovery service endpoint
endpoint = "192.168.1.129:4860"
# Rover identity (defaults to identity.rover_id if not set)
rover_id = "frog-0"
rover_name = "Frog-0"
# WebRTC signaling port (advertised to operators via discovery)
# Note: actual port is set via --rtc-port CLI arg (default 4852)
# Heartbeat interval in seconds
heartbeat_secs = 2

[autonomous]
# Enable autonomous mode support (policy loading)
enabled = true
# Directory containing policy files (.json)
# Policies are versioned JSON files output by the training pipeline
policy_dir = "/var/lib/bvr/policies"
# Specific policy file to load (optional, otherwise loads default.json or first found)
# policy_file = "/var/lib/bvr/policies/nav-v1.0.0.json"
# Maximum linear velocity in autonomous mode (m/s) - safety limit
max_linear_vel = 1.0
# Maximum angular velocity in autonomous mode (rad/s) - safety limit
max_angular_vel = 1.5
# Goal waypoint [x, y] for testing (optional, can be set via command)
# goal = [5.0, 0.0]

[estop]
# Hardware e-stop GPIO configuration (Jetson only)
# Requires building with --features gpio
enabled = false  # Set to true when hardware e-stop button is connected
# GPIO chip device name
gpio_chip = "gpiochip0"
# GPIO line number (Pin 36 on Jetson 40-pin header = GPIO16)
gpio_line = 16
# Active-low logic (true = button connects GPIO to GND when pressed)
active_low = true
# Debounce time in milliseconds
debounce_ms = 50
# Require operator confirmation to release e-stop (latch behavior)
# When true: button release alone won't clear e-stop, operator must send EStopRelease command
# When false: button release immediately clears e-stop
require_confirmation = true

[lidar]
# Enable LiDAR sensor (Livox Mid360)
enabled = true
# LiDAR IP address (default assigned by Livox)
lidar_ip = "192.168.1.177"
# Point cloud UDP port (Livox default: 56301)
point_cloud_port = 56301
# IMU data UDP port (Livox default: 56401, 0 to disable)
imu_port = 56401
# Point cloud streaming settings (for teleop visualization)
stream_voxel_size = 0.2   # Voxel size for downsampling (meters), smaller = more detail
stream_max_points = 1000  # Maximum points per frame for streaming
# IMU mounting pitch angle in degrees (positive = tilted forward/down)
# Mid360 is mounted at 30 degrees forward tilt for maximum coverage
mounting_pitch_deg = 30.0  # Mid360 mounted at 30° forward tilt
# Detection sensitivity: 0=normal, 1=sensitive (better for dark surfaces)
detect_mode = 1
# Enable lens heating (prevents fog/ice in winter)
glass_heat = true
# Minimum detection range in cm (50-200, 0 = device default)
blind_spot_cm = 50
# Offload mounting pitch to lidar firmware (instead of software transform)
use_hardware_transform = false

[localization]
# EKF process noise for linear displacement (m per m traveled)
odom_linear_noise = 0.05
# EKF process noise for angular displacement (rad per m traveled)
odom_angular_noise = 0.02
# GPS measurement noise by fix quality (meters, 1σ)
gps_noise_rtk_fixed = 0.02
gps_noise_rtk_float = 0.5
gps_noise_dgps = 1.0
gps_noise_standalone = 3.0
# Minimum speed to derive heading from GPS (m/s)
gps_heading_min_speed = 0.3
# IMU yaw rate weight (0.0 = wheel only, 1.0 = IMU only)
imu_yaw_weight = 0.7

[slam]
# Enable SLAM (Simultaneous Localization and Mapping)
enabled = true
# Voxel downsampling resolution for GICP (meters)
voxel_size = 0.2
# Maximum GICP iterations per match
max_iterations = 30
# GICP convergence threshold (pose delta norm)
convergence_threshold = 1e-4
# Maximum correspondence distance for outlier rejection (meters)
max_correspondence_dist = 1.0
# Minimum fraction of points with valid correspondences
min_overlap = 0.3
# Distance threshold for inserting new keyframe (meters)
keyframe_distance = 1.0
# Rotation threshold for inserting new keyframe (radians)
keyframe_rotation = 0.5
# Score threshold for accepting loop closure match (0.0-1.0)
loop_closure_threshold = 0.7
# Huber loss threshold for robust loop closure weighting (meters)
huber_threshold = 1.0
# Maximum disagreement between loop closure and odometry (in σ)
loop_closure_max_disagreement_sigma = 3.0

[slam.imu]
# Enable IMU pre-integration for hybrid GICP initial guess
enabled = true
# Gyro noise density (rad/s/sqrt(Hz)) — BMI088 typical: 0.014
gyro_noise_density = 0.014

[slam.persistence]
# Path to save/load the SLAM map file
map_path = "/var/lib/bvr/slam_map.bin"
# Auto-save every N keyframes (0 = disabled)
auto_save_keyframes = 50
# Load prior map on startup for relocalization
load_prior_map = true

[slam.scan_context]
# Number of radial rings for scan context descriptor
num_rings = 20
# Number of azimuthal sectors
num_sectors = 60
# Maximum range (meters)
max_range = 40.0
# Top-K candidates from descriptor search
top_k = 5
# Descriptor distance threshold (lower = stricter)
descriptor_threshold = 0.3

[costmap]
# RANSAC ground plane distance threshold (meters)
ground_distance_threshold = 0.15
# Minimum ground plane inlier fraction for RANSAC
ground_min_inlier_ratio = 0.3
# RANSAC iterations for ground plane fitting
ground_ransac_iterations = 50

[camera]
# Enable camera capture
enabled = true
# Maximum number of cameras to initialize
# Set to 1 on Jetson to reduce CPU usage (~35% per camera)
# Set to 0 to use all detected cameras
max_cameras = 1

[blower]
# Enable blower subsystem (90mm EDF)
enabled = true
# VESC CAN node ID (0x0C = 12, doesn't conflict with drive VESCs 0-3)
can_id = 12
# Maximum power in autonomous mode (percent)
max_power_autonomous = 50
# Power ramp rate (percent per second)
power_ramp_rate = 10
# Minimum velocity to engage blower in autonomous mode (m/s)
min_velocity_threshold = 0.1
# Velocity at which autonomous blower reaches max power (m/s)
max_velocity_for_scaling = 3.0

[kiosk]
# Dashboard kiosk mode on the rover's local display
# When enabled, Firefox opens in fullscreen kiosk mode on boot
# Disable to save ~12% CPU when the local display isn't needed
#
# To apply changes, run on the rover:
#   Enable:  sed -i 's/X-GNOME-Autostart-enabled=false/X-GNOME-Autostart-enabled=true/' ~/.config/autostart/bvr-kiosk.desktop
#   Disable: sed -i 's/X-GNOME-Autostart-enabled=true/X-GNOME-Autostart-enabled=false/' ~/.config/autostart/bvr-kiosk.desktop
# Then reboot or manually start/kill Firefox.
enabled = false
# URL to display in kiosk mode
url = "http://localhost:8080"
