[package]
name = "bvr-cad"
version = "0.1.0"
edition = "2021"
description = "Parametric CAD for BVR rover parts"

[features]
default = ["gltf"]
step = ["vcad/step"]
gltf = ["vcad/gltf"]
usd = ["vcad/usd"]

[dependencies]
vcad = { path = "../../vcad" }
anyhow = "1"

[[bin]]
name = "motor-mount"
path = "src/bin/motor_mount.rs"

[[bin]]
name = "generate-all"
path = "src/bin/generate_all.rs"
