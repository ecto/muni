[package]
name = "mcu-esp32s3-eth"
version = "0.1.0"
edition = "2021"
description = "Generic Ethernet-attached tool controller firmware for ESP32-S3 (PoE)"

[dependencies]
# ESP-IDF std framework (Ethernet + lwIP)
esp-idf-svc = { version = "0.50", features = ["alloc"] }
esp-idf-hal = "0.45"
esp-idf-sys = { version = "0.36", features = ["binstart"] }

# Logging
log = "0.4"
esp-println = { version = "0.13", features = ["esp32s3", "log"], default-features = false }

# Config parsing
toml = "0.8"
serde = { version = "1", features = ["derive"], default-features = false }

# LED control
smart-leds = "0.4"

# Utilities
heapless = "0.8"

[build-dependencies]
embuild = "0.32"

[profile.dev]
opt-level = 3
debug = true

[profile.release]
opt-level = "s"
lto = "fat"
debug = true
